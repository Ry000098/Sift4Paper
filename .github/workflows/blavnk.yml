name: Build The Sift V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Find project ZIP
        run: |
          PROJECT_ZIP=$(find . -name "SiftProject.zip" -print -quit)

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERROR: SiftProject.zip was not found."
            exit 1
          fi

          echo "Found ZIP: $PROJECT_ZIP"
          echo "PROJECT_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p sift-build
          unzip "$PROJECT_ZIP" -d sift-build

          echo "Files extracted:"
          find sift-build -maxdepth 4 -type f | head -100

      - name: Find Gradle project
        run: |
          BUILD_FILE=$(find sift-build \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle or build.gradle.kts was found."
            echo "Contents of the ZIP:"
            find sift-build -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found Gradle project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build Sift
        run: |
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build --stacktrace

      - name: Find finished plugin JAR
        run: |
          JAR=$(find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            ! -name "*sources*" \
            ! -name "*javadoc*" \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: Gradle finished but I couldn't find the plugin JAR."
            find "$PROJECT_DIR/build" -type f || true
            exit 1
          fi

          echo "Found plugin: $JAR"
          cp "$JAR" UPLOAD-THIS-TO-PEBBLEHOST.jar

      - name: Upload finished Sift plugin
        uses: actions/upload-artifact@v4
        with:
          name: TheSift-Paper-26.3
          path: UPLOAD-THIS-TO-PEBBLEHOST.jar
          if-no-files-found: error
