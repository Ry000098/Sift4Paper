name: Build The Sift

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract Sift project
        run: |
          mkdir sift-build
          unzip TheSift-GitHub-SMALL-Upload/SiftProject.zip -d sift-build

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build Sift
        working-directory: sift-build
        run: gradle build --stacktrace

      - name: Prepare plugin
        run: |
          JAR=$(find sift-build/build/libs -name "*.jar" ! -name "*sources*" ! -name "*javadoc*" | head -1)
          cp "$JAR" UPLOAD-THIS-TO-PEBBLEHOST.jar

      - name: Upload finished plugin
        uses: actions/upload-artifact@v4
        with:
          name: TheSift-Paper-26.3
          path: UPLOAD-THIS-TO-PEBBLEHOST.jar
